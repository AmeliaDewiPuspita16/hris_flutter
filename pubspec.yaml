name: hris_mobile
description: HRIS Mobile App - Flutter
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^8.2.1
  month_picker_dialog: ^6.7.3
  table_calendar: ^3.1.2
  intl: any
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Isi folder ikut terbundel otomatis — cukup taruh berkasnya, tidak perlu
  # mendaftarkan satu per satu di sini.
  assets:
    - assets/images/
    - assets/icons/