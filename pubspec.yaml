name: hris_mobile
description: HRIS Mobile App - Flutter
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^8.2.1
  month_picker_dialog: ^6.7.3
  table_calendar: ^3.1.2
  intl: any
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.1.1
  image_picker: ^1.2.3
  # Membuka lampiran PR (berkas maupun tautan) di aplikasi bawaan perangkat.
  url_launcher: ^6.3.1
  image_cropper: ^12.2.1
  shimmer: ^3.0.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.2
  pdfrx: ^2.10.1
  # Ilustrasi & latar header SVG (mis. halaman Records) di assets/icons/.
  flutter_svg: ^2.3.0
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6
  file_picker: ^13.3.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.4

# Layar pembuka bawaan sistem, yang tampil sejak ikon diketuk sampai Flutter
# menggambar frame pertamanya. Tanpa ini, layarnya putih dan pengguna melihat
# kilatan putih sebelum splash hijau muncul.
#
# Sengaja tanpa logo: logonya hijau tua dan akan hilang di latar hijau, lagipula
# SplashScreen Flutter memunculkan logo itu dengan animasi memudar dari nol —
# menampilkannya di sini justru bikin berkedip. Warna polos membuat sambungan
# ke frame pertama Flutter tidak terlihat sama sekali.
#
# Regenerasi setelah mengubah blok ini:
#   dart run flutter_native_splash:create
flutter_native_splash:
  # AppColors.primary
  color: "#0E4A34"

  android_12:
    color: "#0E4A34"

# Ikon aplikasi di launcher Android & home screen iOS.
#
# Gambar sumbernya di assets/launcher/, BUKAN assets/icons/ — folder itu ikut
# terbundel ke aplikasi (lihat blok `flutter.assets`), padahal PNG 1024px ini
# cuma dibutuhkan saat generate.
#
# - app_icon.png: ikon lengkap 1024x1024, latar penuh tanpa transparansi
#   (iOS menolak ikon beralpha). Dipakai iOS dan Android lama.
# - app_icon_foreground.png: simbolnya saja di latar transparan, 1024x1024,
#   simbol di dalam ~66% tengah — Android 8+ memotong ikon adaptif jadi
#   lingkaran/squircle, bagian pinggir bisa terpotong.
# - app_icon_background.png: gradasi hijaunya saja, lapisan belakang ikon
#   adaptif — supaya sama dengan app_icon.png, bukan hijau polos.
#
# Ketiganya diturunkan dari assets/images/m_logo.jpg (simbol emas dipisahkan
# dari latarnya, gradasi diukur ulang dari logo itu).
#
# Regenerasi setelah mengganti gambar atau mengubah blok ini:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/launcher/app_icon.png"
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "assets/launcher/app_icon_background.png"
  adaptive_icon_foreground: "assets/launcher/app_icon_foreground.png"
  # Jarak ke tepi sudah ada di gambarnya sendiri; inset bawaan plugin (16%)
  # akan menciutkan simbolnya dua kali.
  adaptive_icon_foreground_inset: 0

flutter:
  uses-material-design: true

  # Isi folder ikut terbundel otomatis — cukup taruh berkasnya, tidak perlu
  # mendaftarkan satu per satu di sini.
  assets:
    - assets/images/
    - assets/icons/
    # PDF contoh untuk viewer dokumen IMS selama URL dokumen masih dummy.
    - assets/documents/
