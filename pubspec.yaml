name: hris_mobile
description: HRIS Mobile App - Flutter
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^8.2.1
  month_picker_dialog: ^6.7.3
  table_calendar: ^3.1.2
  intl: any
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.1.1
  image_picker: ^1.2.3
  # Membuka lampiran PR (berkas maupun tautan) di aplikasi bawaan perangkat.
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.4

# Layar pembuka bawaan sistem, yang tampil sejak ikon diketuk sampai Flutter
# menggambar frame pertamanya. Tanpa ini, layarnya putih dan pengguna melihat
# kilatan putih sebelum splash hijau muncul.
#
# Sengaja tanpa logo: logonya hijau tua dan akan hilang di latar hijau, lagipula
# SplashScreen Flutter memunculkan logo itu dengan animasi memudar dari nol —
# menampilkannya di sini justru bikin berkedip. Warna polos membuat sambungan
# ke frame pertama Flutter tidak terlihat sama sekali.
#
# Regenerasi setelah mengubah blok ini:
#   dart run flutter_native_splash:create
flutter_native_splash:
  # AppColors.primary
  color: "#0E4A34"

  android_12:
    color: "#0E4A34"

flutter:
  uses-material-design: true

  # Isi folder ikut terbundel otomatis — cukup taruh berkasnya, tidak perlu
  # mendaftarkan satu per satu di sini.
  assets:
    - assets/images/
    - assets/icons/